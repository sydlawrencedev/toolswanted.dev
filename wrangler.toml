name = "toolswanted"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# The real domain. Cloudflare creates the DNS record and the certificate.
routes = [
  { pattern = "toolswanted.dev", custom_domain = true },
  { pattern = "www.toolswanted.dev", custom_domain = true },
]

# The board is server-rendered HTML. Static files (CSS, favicon) are served by
# the Worker itself so there is exactly one deployment and one routing table.
[observability]
enabled = true

# Used to version cache keys, so a deploy busts the edge cache instead of
# serving the previous version of the board for an hour.
[version_metadata]
binding = "VERSION_METADATA"

[vars]
SITE_URL = "https://toolswanted.dev"
SITE_NAME = "Tools Wanted"
# Cosine similarity above which a new wish is folded into an existing cluster.
# Tuned with scripts/tune-threshold.ts against a labelled pair set.
MATCH_THRESHOLD = "0.723"
# Cosine similarity above which an existing MCP server is offered as an alternative.
SERVER_MATCH_THRESHOLD = "0.57"
# A cluster stays in the review queue until it has this many wishes...
AUTO_PUBLISH_WISHES = "3"
# ...or an admin approves it.
RATE_LIMIT_WISHES_PER_HOUR = "30"
RATE_LIMIT_SEARCH_PER_MINUTE = "30"
REGISTRY_CRON = "*/5 * * * *"

# Workers AI: embeddings for clustering, and the model that rewrites a wish
# into one generic line.
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "toolswanted"
database_id = "5c87faf7-018f-4df8-82b9-495594aa600b"
migrations_dir = "migrations"

# Clusters: bge-large, the core mechanic, best separation we measured.
[[vectorize]]
binding = "VECTORS"
index_name = "toolswanted-clusters"

# The mirror of the official MCP registry: bge-small, cheap enough to index
# tens of thousands of servers.
[[vectorize]]
binding = "SERVER_VECTORS"
index_name = "toolswanted-servers"

[[kv_namespaces]]
binding = "KV"
id = "9b15a7743f604369b6a59d4a874804d7"

[triggers]
crons = ["*/5 * * * *", "0 8 * * 1"]

# Secrets (set with `wrangler secret put <NAME>`):
#   ADMIN_TOKEN  - passphrase for /admin
#   GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET - OAuth app for builder claims
#   IP_SALT      - random salt for hashing IPs and fingerprints
